name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select regressions
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.selection.outputs.groups }}
      has-regressions: ${{ steps.selection.outputs.has-regressions }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Classify the entire PR, including both sides of renames/deletions.
          fetch-depth: 0
      - id: selection
        run: node scripts/ci-select.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-selection
          path: output/ci/
          retention-days: 14

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Audit root project (dev + optional dependencies)
        run: |
          npm ci
          npm audit --include=dev --include=optional --audit-level=low
      - name: Audit proxy-worker project (dev + optional dependencies)
        working-directory: utilities-src/vm-src/proxy-worker
        run: |
          npm ci
          npm audit --include=dev --include=optional --audit-level=low
      - name: Run worker tests (includes toolchain verification regression tests)
        working-directory: utilities-src/vm-src/proxy-worker
        run: npm test
      - name: Verify local Wrangler matches the lockfile
        working-directory: utilities-src/vm-src/proxy-worker
        run: npm run verify:toolchain --silent
      - name: Validate worker deployment (credential-free dry run)
        working-directory: utilities-src/vm-src/proxy-worker
        run: npm run deploy:dry-run

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run utilities:typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run utilities:test

  package:
    name: Packaged site smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Run alongside cheap checks rather than waiting for them to finish.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run utilities:build
      - run: npm run smoke:source
      - run: npm run check-links
      - run: npm run build:deploy
      - run: npm run smoke:deploy
      - run: npm run check-links
        env:
          CHECK_LINKS_ROOT: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run pr:check
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-validation-evidence
          path: output/pr/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  regression:
    name: Regression (${{ matrix.group }})
    needs: select
    if: needs.select.outputs.has-regressions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Preserve evidence from other groups if one group fails.
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.select.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Rebuilding takes seconds; transferring the ~580 MB site to each job costs more.
      - run: npm run utilities:build
      - run: npm run build:deploy
      - run: npm run smoke:deploy
      - name: Install required browsers
        env:
          GROUP: ${{ matrix.group }}
        run: |
          if [ "$GROUP" = cache ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install --with-deps chromium firefox webkit
          fi
      - run: npm run release:check
        env:
          RELEASE_GROUP: ${{ matrix.group }}
          RELEASE_BROWSERS: chromium,firefox,webkit
          # PRs/beta stop at the first failure in each group; full runs collect all failures.
          RELEASE_FAIL_FAST: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/beta')) && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation-${{ matrix.group }}
          path: output/
          retention-days: 14

  # Stable required check: fail on failed/cancelled/unexpectedly skipped dependencies.
  build:
    name: Build
    runs-on: ubuntu-latest
    if: always()
    needs: [security-audit, lint, typecheck, test, select, package, regression]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci-gate.js
            scripts/ci-select.js
          sparse-checkout-cone-mode: false
      - run: node scripts/ci-gate.js
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}

  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
