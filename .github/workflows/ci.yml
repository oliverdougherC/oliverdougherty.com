name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select regressions
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.selection.outputs.groups }}
      lanes: ${{ steps.selection.outputs.lanes }}
      lane-profile: ${{ steps.selection.outputs.lane-profile }}
      has-regressions: ${{ steps.selection.outputs.has-regressions }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Classify the entire PR, including both sides of renames/deletions.
          fetch-depth: 0
      - id: selection
        run: node scripts/ci-select.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-selection
          path: output/ci/
          retention-days: 14

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Audit root project (dev + optional dependencies)
        run: |
          npm ci
          node scripts/audit-check.js
      - name: Audit proxy-worker project (dev + optional dependencies)
        working-directory: utilities-src/vm-src/proxy-worker
        run: |
          npm ci
          node ../../../scripts/audit-check.js .
      - name: Run worker tests (includes toolchain verification regression tests)
        working-directory: utilities-src/vm-src/proxy-worker
        run: npm test
      - name: Verify local Wrangler matches the lockfile
        working-directory: utilities-src/vm-src/proxy-worker
        run: npm run verify:toolchain --silent
      - name: Validate worker deployment (credential-free dry run)
        working-directory: utilities-src/vm-src/proxy-worker
        run: npm run deploy:dry-run

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run utilities:typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run utilities:test

  package:
    name: Packaged site smoke
    # Browsers + OS deps ship in the image pinned to the Playwright version.
    runs-on: ubuntu-latest
    # Image tag is version-matched to the pinned playwright dependency; bump
    # both together. Browsers and OS deps ship in it, so no per-job apt or
    # download step exists to stall the run. (Job-level `container` cannot
    # read the `env` context, so the tag is literal here.)
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      # The container user differs from the uid owning the host-mounted
      # workspace, so git needs an explicit trust exception to read the
      # candidate commit (build marker, release validation).
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    timeout-minutes: 10
    # Run alongside cheap checks rather than waiting for them to finish.
    steps:
      - uses: actions/checkout@v4
      # The container ships Node 24 (>= engines requirement); npm reads the
      # lockfile, and Playwright finds its baked browsers via PLAYWRIGHT_BROWSERS_PATH.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node24-npm-
      - run: npm ci --prefer-offline
      - run: npm run utilities:build
      - run: npm run smoke:source
      - run: npm run check-links
      - run: npm run build:deploy
      - run: npm run smoke:deploy
      - run: npm run check-links
        env:
          CHECK_LINKS_ROOT: dist
      - run: npm run pr:check
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-validation-evidence
          path: output/pr/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  regression:
    name: Regression (${{ matrix.lane }})
    needs: select
    if: needs.select.outputs.has-regressions == 'true'
    runs-on: ubuntu-latest
    # Image tag is version-matched to the pinned playwright dependency; bump
    # both together. Browsers and OS deps ship in it, so no per-job apt or
    # download step exists to stall the run. (Job-level `container` cannot
    # read the `env` context, so the tag is literal here.)
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    env:
      # See the smoke job: git needs the container-safe workspace exception.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    timeout-minutes: 45
    strategy:
      # Preserve evidence from other lanes if one lane fails.
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.select.outputs.lanes) }}
    steps:
      - uses: actions/checkout@v4
      # Rebuilding takes seconds; transferring the ~580 MB site to each job costs more.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node24-npm-
      - run: npm ci --prefer-offline
      - run: npm run utilities:build
      - run: npm run build:deploy
      - run: npm run smoke:deploy
      - run: npm run release:check
        env:
          RELEASE_LANE: ${{ matrix.lane }}
          # main/nightly/manual: full suite split by release group, all browsers.
          # PRs/beta: targeted lanes - Chromium suites plus the cross-engine sweep.
          RELEASE_PROFILE: ${{ needs.select.outputs.lane-profile }}
          # PRs/beta stop at the first failure in each lane; full runs collect all failures.
          RELEASE_FAIL_FAST: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/beta')) && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation-${{ matrix.lane }}
          path: output/
          retention-days: 14

  # Stable required check: fast jobs plus the full regression matrix/lanes.
  # Fail on failed/cancelled/unexpectedly skipped dependencies.
  build:
    name: Build
    runs-on: ubuntu-latest
    if: always()
    needs: [security-audit, lint, typecheck, test, select, package, regression]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci-gate.js
            scripts/ci-select.js
            scripts/release-check.js
            scripts/lib/playwright-static.js
          sparse-checkout-cone-mode: false
      - run: node scripts/ci-gate.js
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}

  # Main-branch deployment gate: everything fast and required, but never the
  # long cross-browser matrix, which stays on `Build` and the nightly instead.
  build-deploy:
    name: Build (deploy gate)
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [security-audit, lint, typecheck, test, select, package]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci-gate.js
            scripts/ci-select.js
            scripts/release-check.js
            scripts/lib/playwright-static.js
          sparse-checkout-cone-mode: false
      - run: node scripts/ci-gate.js
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GATE_DEPLOY: 'true'

  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build-deploy
    permissions:
      pages: write
      id-token: write
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-deploy.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
