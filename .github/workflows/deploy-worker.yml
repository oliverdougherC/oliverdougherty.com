name: Deploy Worker
on:
  push:
    branches:
      - main
    paths:
      - 'utilities-src/vm-src/proxy-worker/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: utilities-src/vm-src/proxy-worker/package-lock.json
      - name: Install exact lockfile toolchain
        working-directory: utilities-src/vm-src/proxy-worker
        run: npm ci
      - name: Audit worker dependencies (dev + optional, fail on low)
        working-directory: utilities-src/vm-src/proxy-worker
        run: npm audit --include=dev --include=optional --audit-level=low
      - name: Run worker tests
        working-directory: utilities-src/vm-src/proxy-worker
        run: npm test
      - name: Validate deployment with lockfile Wrangler (dry run)
        working-directory: utilities-src/vm-src/proxy-worker
        run: npm run deploy:dry-run
      - name: Verify lockfile Wrangler is the installed tool
        working-directory: utilities-src/vm-src/proxy-worker
        run: |
          INSTALLED=$(npx --no-install wrangler --version 2>/dev/null | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "lockfile wrangler: $LOCKED, installed: $INSTALLED"
          [ "$LOCKED" = "$INSTALLED" ] || { echo "installed wrangler does not match lockfile"; exit 1; }
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'utilities-src/vm-src/proxy-worker'
